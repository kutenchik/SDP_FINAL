server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackathon_hub}
    username: ${DB_USER:hackathon}
    password: ${DB_PASSWORD:hackathon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
hub:
  seed: ${SEED_DATA:true}
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
