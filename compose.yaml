services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackathon_hub
      POSTGRES_USER: ${DB_USER:-hackathon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackathon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hackathon_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
